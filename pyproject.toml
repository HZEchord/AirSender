[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airsender"
version = "0.5.0"
description = "把 Windows 系統音訊以未壓縮 PCM 送到 HomePod / AirPlay、Google Cast、DLNA、Snapcast 接收端"
license = { text = "MIT" }
keywords = ["airplay", "homepod", "wasapi", "loopback", "chromecast", "dlna", "snapcast"]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyatv==0.18.0",
    "PyAudioWPatch>=0.2.12.7",
    "soxr>=1.0",
    "numpy>=2.0",
    "pystray>=0.19.5",
    "pillow>=10.0",
    "aiohttp>=3.9",
    "PyChromecast>=14.0",
    "async-upnp-client>=0.40",
]

[project.scripts]
airsender = "airsender.__main__:main"

[project.gui-scripts]
airsender-tray = "airsender.__main__:main"

[tool.setuptools]
packages = ["airsender", "airsender.sinks"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "UP007", "UP045", "E731"]

[tool.ruff.lint.isort]
known-first-party = ["airsender"]
