name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller ruff

      - name: Lint
        run: ruff check airsender tools

      - name: Byte-compile and import check
        run: |
          python -m compileall -q airsender tools
          python -c "import airsender.streamer, airsender.tray, airsender.httpstream, airsender.sinks.cast, airsender.sinks.dlna, airsender.sinks.snapcast"

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Build icon and PyInstaller bundle
        run: |
          python tools\make_icon.py
          python -m PyInstaller --noconfirm --clean --log-level WARN AirSender.spec

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\AirSender.iss'

      - uses: actions/upload-artifact@v4
        with:
          name: AirSender-installer
          path: dist/installer/*.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/installer/*.exe
          generate_release_notes: true
