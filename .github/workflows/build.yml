name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# 建置工作只需讀取；只有 tag 觸發的 release 工作拿寫入權限（發布 Release）
permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --require-hashes -r requirements-build.lock

      - name: Lint
        run: |
          ruff check airsender tools tests
          ruff format --check airsender tools tests

      - name: Byte-compile and import check
        run: |
          python -m compileall -q airsender tools
          python -c "import airsender.streamer, airsender.tray, airsender.httpstream, airsender.sinks.cast, airsender.sinks.dlna, airsender.sinks.snapcast"

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Build icon and PyInstaller bundle
        run: |
          python tools\make_icon.py
          python -m PyInstaller --noconfirm --clean --log-level WARN AirSender.spec

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y --version=6.7.1

      - name: Build installer
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\AirSender.iss'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AirSender-installer
          path: dist/installer/*.exe

          generate_release_notes: true

  release:
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: AirSender-installer
          path: dist/installer
      - name: Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/installer/*.exe
